name: Deploy to Cloudflare

# Deploys the Worker on every push to main, plus a manual "Run workflow" button.
# The Turso credentials live as Worker secrets (set once with `wrangler secret
# put`); they persist across deploys, so CI only needs the Cloudflare token.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys if you push twice quickly.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy -c .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
